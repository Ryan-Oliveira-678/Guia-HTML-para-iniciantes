<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Hierarquia de Títulos</title>
  <style>
    /* O CSS padroniza o visual independentemente do tamanho padrão do HTML */
    .titulo-secao {
      font-size: 1.5rem;
      color: #333;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Título principal e único da página -->
  <h1>Simulador de Investimentos</h1>

  <!-- Título de uma seção importante -->
  <h2 class="titulo-secao">Renda Fixa</h2>

  <!-- Subtópico dentro de Renda Fixa -->
  <h3>Tesouro Direto</h3>

</body>
</html>
